<script>
	const vendors = [
  {

    "name": "",

    "country": "Netherlands",
    "description": "",
    "picture": "839295A0B12D64E8_8B3790B24DF0A592_field5.jpg"
  }
,  {
    "id": 197,
    "name": "innerSanctvm perfumes",
    "websiteurl": "https://innersanctvm.com/",
    "country": "Belgium",
    "description": "innerSanctvm creates distinctive, atmospheric fragrances inspired by art, history, and natural decay. Each scent is handcrafted in small batches using high-quality materials. Visit our stall to find your perfect fragrance, take your time testing and do not hesitate to ask for guidance. We offer 15 and 50 ml Eau de Parfum, Extrait, and Discovery Sets. Discover classics and new releases, all created in-house at our atelier in Leuven which you can visit by appointment.",
    "picture": "839295A0B12D64E8_A7D20EED0C2900B8_field5.jpg"
  }
,  {
    "id": 198,
    "name": "",
    "websiteurl": "",

    "description": "",
    "picture": ""
  }
,  {
    "id": 199,
    "name": "",
    "websiteurl": "",
    "country": "",
    "description": "",
    "picture": ""
  }

];

	//let vendors = [];
	
	const listEl = document.getElementById("vendor-list");

	if (vendors.length === 0) {
		const li = document.createElement("li");
		li.innerHTML = `
			<span class="item-content item-link">
			  <div class="dz-inner">
				<div class="dz-title">COMING SOON</div> 
			  </div>
			</span>
		  `;
		  listEl.appendChild(li);
	} else {
		vendors
		  .filter(v => v.name && v.name.trim() !== "")   // <-- TOEGEVOEGD
		  .sort((a, b) => a.name.localeCompare(b.name))
		  .forEach(v => {
		  const li = document.createElement("li");
		  if (v.picture === 'noimage.jpg') {
			  li.innerHTML = `
				<a class="item-content">
				  <div class="dz-inner">
					<div class="dz-title">${v.name}</div> 
				  </div>
				</a>
			  `;
		  }
		  else {
			  li.innerHTML = `
				<a href="vendor.html?id=${v.id}" class="item-content item-link">
				  <div class="dz-inner">
					<div class="dz-title">${v.name}</div> 
				  </div>
				</a>
			  `;
		  }
		  listEl.appendChild(li);
		});
	}
</script>
